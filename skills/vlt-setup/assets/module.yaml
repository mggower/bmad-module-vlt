code: vlt
name: "Vault"
description: "A self-evolving cast of distinct AI partners — librarian, researcher, creative, and more they mint themselves — who share one living knowledge vault. Install it into a vault and the cast grows itself."
module_version: 0.17.1
default_selected: false
module_greeting: >
  Vault is installed — your cast of partners now shares one living knowledge vault.

  Summon the Librarian to tend the collection ("Librarian, ingest this article…"), the
  Researcher to be pushed to learn ("Researcher, dig into transformer attention…"), or the
  Creative to turn knowledge into made things ("Creative, shape a deliverable on…"). They read
  the same wiki, hand work to each other through it, and can grow the roster themselves with
  vlt-mint. Install Vault into each vault you want a cast for; re-run vlt-setup anytime to refresh.

# --- Agent roster (install-time contract; consumed by module.yaml:agents[] and roster UIs) ---
# Partners are summoned by role; name is left empty so roster UIs fall back to title. An owner
# may set a personal name later via [agents.<code>] in central config.
agents:
  - code: librarian
    name: ""
    title: Librarian
    icon: 📚
    description: The keeper of the vault's collection — tends the wiki, integrates new knowledge, keeps it healthy and single-home.
  - code: researcher
    name: ""
    title: Researcher
    icon: 🔭
    description: The vault's intellectual sparring partner — reaches into the world to build new knowledge and pushes you to learn.
  - code: creative
    name: ""
    title: The Creative
    icon: 🎨
    description: The vault's design and fabrication partner — turns curated knowledge into made things and challenges your ideas toward producing them.

# --- Configuration variables ---
# The vault IS the project — Vault is installed into each vault, so there is no vault registry.
# Two variables: an optional layout override and the feedback transport endpoint.

vault_structure:
  prompt: "(Advanced) Override any vault sub-paths that differ from the conventional layout? Most vaults won't need this."
  # CANONICAL default map — the SINGLE SOURCE OF TRUTH for the structure map.
  # vlt-setup reads this (never a hand-transcribed markdown table) and materializes it into
  # config.yaml, merging any user overrides on top. To add/rename a logical path, edit it HERE.
  default:
    wiki: resources/wiki/
    index: resources/wiki/index.md
    research: _agent/research/
    sessions: _agent/sessions/
    specs: _agent/specs/
    log: _agent/log.md
    backlog: _agent/backlog.md
    projects: projects/
    areas: areas/
    resources: resources/
    handoffs: _agent/handoffs/
    partners: _agent/partners/
    capabilities: _agent/capabilities/
    conventions: _meta/conventions/
    overlays: _agent/conventions/
    personas: _meta/personas/
    contract: _meta/vault-operating-contract.md
    upgrade_ledger: _agent/upgrade-ledger.md
    archive: _archive/
    tripwires: _agent/tripwires.yaml
    lint_reports: _agent/lint-reports/
    upgrade_reports: _agent/upgrade-reports/
  example: "wiki → resources/wiki/ — override a single entry only if this vault diverges"

feedback_repo:
  # Transport endpoint for vlt-feedback (OWNER/REPO slug for `gh --repo`). A defined
  # variable (dict with default:) — merge-config.py exports ONLY defined variables into
  # config.yaml's vlt: section; a flat scalar here would be silently dropped (roundtable
  # A13). Public module metadata; override per-vault in config.yaml if filing elsewhere.
  default: mggower/bmad-module-vlt

# --- Machine-tool dependencies (module level) ---
# The machine-level tools shipped skills assume. Read directly from this file by
# vlt-setup's Check Dependencies machine-tool probe (report, never gate). NOT a defined
# variable (no prompt:/default: markers) and not metadata — merge-config.py ignores a
# list-valued top-level key by its declaration read (B7-2), so this never reaches
# config.yaml and is never prompted. Writer clause (same-act): a module build that adds
# a shipped tool assumption adds its row here in the same build.
machine_tools:
  - tool: gh
    needed_by: "vlt-feedback (issue transport pre-flight)"
    absent: "degrades to the paste-ready outbox failure path (named error gh-missing)"
  - tool: uv
    needed_by: "vlt-setup / vlt-upgrade merge + manifest scripts and vlt-lint's findings-cache script (PEP 723 inline deps)"
    absent: "config/help/manifest merges cannot run — install uv before setup or upgrade; a full-mode vlt-lint sweep still runs and renders lint_cache: cold — the sweep never fails because its cache did"
  - tool: python3
    needed_by: "the vlt-vitals SessionStart hook (enforcement kit)"
    absent: "hook prints only its own error line — loud, never silent-green"
  - tool: git
    needed_by: "the vault itself (groom safety model, upgrade ledger refs, worktrees)"
    absent: "the durability premise fails — effectively required for a vault"
