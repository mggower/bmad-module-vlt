# The tripwire registry — vault-level enforcement wires (build B5-9).
#
# WHAT THIS IS. The enforcement kit's registry: each wire binds a DERIVED
# metric to a threshold and a surface. The vitals reader
# (.claude/hooks/vlt-vitals.py) evaluates every wire on demand (the
# SessionStart strip; the `vlt-dispatch ledger` Tripped-wires section).
#
# DERIVE-FIRST (the design invariant, stated where the file lives): wires
# reference derived metrics only — NO OP EVER WRITES COUNTERS; every figure
# is derived fresh from existing vault records at read time. The canonical
# metric vocabulary is the METRICS table in .claude/hooks/vlt-vitals.py —
# a wire's `metric` must name an id from that table OR a `local_metrics:`
# declaration in this same file (below); an unknown id remains a loud
# per-wire error, never a silent skip. The bound (B10-4): local metrics are
# DECLARATIVE and cover the common count/size/age shapes only — a derive
# beyond those kinds has no vault-local home; its route is an upstream filing
# for a new canonical metric or a new kind (the same route METRICS additions
# take), never a hand-edit of the module-owned reader.
#
# SCHEMA (all seven fields REQUIRED on every wire):
#   id            — short kebab-case wire name (unique in this file)
#   metric        — a canonical metric id from the vitals reader's table
#   threshold     — comparison + integer, e.g. ">= 10" or "> 21"
#   owner         — the partner slug whose debt this is (who acts on a trip)
#   moment        — where the trip surfaces (SessionStart strip / ledger)
#   surface_text  — the short phrase rendered beside the value on a trip;
#                   phrase it as the responding act — a wire's legal response
#                   homes HERE, not in any per-check field
#   review_after  — date this wire itself should be re-examined (the wiki-page
#                   key's date semantics, referenced not redefined)
#
# LOCAL METRICS (optional top-level `local_metrics:` section — B10-4, the
# durable vault-local metric home). Each entry is a flat map declaring a
# derived metric this vault grows for itself; the vitals reader derives it
# beside the canonical table and wires may reference it by id:
#   id          — kebab-case metric name, unique in this file, and NOT
#                 shadowing a canonical METRICS id (a shadow is a loud error)
#   kind        — one of the bounded derive kinds:
#                   file_count        — count of files matching `glob`
#                   bytes             — byte size of the file or directory at `path`
#                   days_since_newest — age in days of the newest file matching
#                                       `glob`, dated by its dated filename or
#                                       frontmatter date — NEVER mtime (git
#                                       operations and copies corrupt mtimes)
#   glob / path — the kind's vault-relative locator; `{key}` structure-map
#                 logical names resolve the way the reader's own derivations
#                 do (e.g. "{research}/**/*.md")
#   definition  — one line of prose (the METRICS-table analogue, so the
#                 vitals report renders the value denominated)
# A malformed or unresolvable declaration is a LOUD per-entry error, never a
# silent skip; an unresolvable locator derives n/a with the reason stated.
# The seed ships NO local_metrics — the section is this vault's to grow.
#
# WRITE MOMENTS (wires AND local_metrics alike). This registry is written
# ONLY at rare, human-gated moments:
# a mint or council verdict that defers an enforcement leg outside any
# convention's frontmatter (vlt-mint Step 2a / vlt-review-council Step 3 —
# the non-convention deferral rule), or a deliberate human edit. Frontmatter
# deferrals remain the per-convention wires (frontmatter.md, Enforcement
# declaration); this registry holds metrics belonging to no single convention
# and never duplicates a frontmatter deferral. One finder per fact:
# lint/dispatch find, tripwires nag.
#
# VAULT-GROWN AFTER SEEDING. vlt-setup seeds this file when absent and
# merges by `id` when present: ship-seeded wires are added only if their id
# is absent; LOCAL THRESHOLDS WIN; local wires are never dropped or
# rewritten — and the vault's `local_metrics:` declarations share exactly
# that fate: never dropped, rewritten, or reordered by seeding (the seed
# ships none, so the merge has nothing to add there). Everything below the
# seed is this vault's to evolve.
#
# The four stock wires (the original pair plus the decay-contract pair, Arc 8
# — the alert-fatigue budget is a hard constraint; add a further wire only
# when a real failure earns it):

wires:
  - id: lint-debt
    metric: ingests_since_lint
    threshold: ">= 10"
    owner: librarian
    moment: SessionStart strip + ledger
    surface_text: "ingests since the last lint — run vlt-lint"
    review_after: 2027-01-31

  - id: relay-overdue
    metric: oldest_open_pointer_days
    threshold: "> 21"
    owner: librarian
    moment: SessionStart strip + ledger
    surface_text: "days the oldest open dispatch pointer has waited — summon its partner"
    review_after: 2027-01-31

  - id: log-mass
    metric: log_bytes
    threshold: ">= 262144"
    owner: librarian
    moment: SessionStart strip + ledger
    surface_text: "live {log} bytes — rotate the log (`vlt-decay`)"
    review_after: 2027-02-28

  - id: drain-due
    metric: oldest_drainable_section_days
    threshold: "> 45"
    owner: librarian
    moment: SessionStart strip + ledger
    surface_text: "days the oldest drainable dispatch section has sat closed on the live board — drain the board (`vlt-decay`)"
    review_after: 2027-02-28
