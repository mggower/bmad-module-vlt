# Field-contract issue form (pattern / candidate). ADDITIVE-ONLY: fields may be added,
# never renamed or removed and never change meaning, without bumping rail_contract. The
# shape's single source of truth is skills/vlt-feedback/references/field-contract.md —
# this form derives from it and never restates it.
name: Field pattern / candidate
description: A live vault observed a recurring pattern or has an upstream-this proposal. Follows the field contract.
labels: ["vault-filed"]
body:
  - type: markdown
    attributes:
      value: |
        This form is one surface of the module's **field contract** — single-homed at
        [`skills/vlt-feedback/references/field-contract.md`](https://github.com/mggower/bmad-module-vlt/blob/main/skills/vlt-feedback/references/field-contract.md).
        One form covers both non-defect kinds because issue forms cannot branch labels on a
        dropdown: **the `kind` field below is authoritative**; the matching
        `field:pattern` / `field:candidate` label is applied by the filer (if permissions
        allow) or at owner triage. Filing from an installed vault? Prefer the
        `vlt-feedback` skill — it scrubs, previews, and stamps the payload for you.
        Note: comments added after an issue is labeled `captured` reach the factory only if the owner admits them by hand — an amendment channel is planned; until it ships, assume a comment on a captured issue is not read.
  - type: textarea
    id: what_happened
    attributes:
      label: what_happened
      description: What happened / the observation, concretely, as hit in real use.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: evidence
      description: "Generalized evidence: placeholder paths (`_agent/{zone}/{file}.md` style), quoted behavior, exact text. No vault-local literals, no personal-domain content."
    validations:
      required: true
  - type: textarea
    id: provenance_guess
    attributes:
      label: provenance_guess
      description: Where in the module source this probably lives — explicitly a guess; the factory grounds it before capture.
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: kind
      description: "Authoritative classification — select `pattern` (recurring shape worth naming) or `candidate` (this should ship upstream). The matching `field:` label follows this field, applied by you or at owner triage."
      options:
        - pattern
        - candidate
    validations:
      required: true
  - type: input
    id: origin_vault
    attributes:
      label: origin_vault
      description: The vault the signal originated in (a short vault name, not a path).
    validations:
      required: true
  - type: input
    id: acceptance_vault
    attributes:
      label: acceptance_vault
      description: Where acceptance should run — the vault (or kind of vault) that can verify the change.
    validations:
      required: false
  - type: input
    id: module_version
    attributes:
      label: module_version
      description: The filing vault's installed module version.
    validations:
      required: true
  - type: input
    id: rail_contract
    attributes:
      label: rail_contract
      description: The field-contract version this payload follows.
      value: "1"
    validations:
      required: true
